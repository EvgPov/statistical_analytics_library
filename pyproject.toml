[tool.poetry]
name = "statistical-analytics-library"
version = "0.1.0"
description = "Библиотека статистического анализа"
authors = ["Povaliaeva"]
readme = "README.md"

packages = [
    { include = "statistical_analytics_library", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11"
numpy = "^2.4.2"
scipy = "^1.17.1"
pandas = "^3.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"